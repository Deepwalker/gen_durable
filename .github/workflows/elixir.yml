name: Elixir CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

# Supply-chain note: every third-party action is pinned to a full commit SHA and
# every service image to a content digest. Tags (@v4, :17) are mutable — whoever
# controls the upstream repo or registry namespace can repoint one at malicious
# code, which would then run here with this workflow's token. A SHA/digest cannot
# be repointed. The `# vX.Y.Z` comments record what each pin was, and Dependabot
# (.github/dependabot.yml) proposes the bumps so the pins stay fresh instead of
# rotting. Hex deps are already integrity-checked by the hashes in mix.lock.

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    # The engine needs Postgres; the {:redis, _} poke transport and the Redis
    # limiter backend tests need Redis. Versions match .devcontainer.
    services:
      postgres:
        image: postgres:17@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gen_durable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIX_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gen_durable_test
      REDIS_URL: redis://localhost:6379

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Nothing here pushes; don't leave the token in .git/config where a
        # compromised dependency or test could read it.
        persist-credentials: false
    - name: Set up Elixir
      # Toolchain matches .devcontainer. (The old v1.16.0 pin also could not map
      # the ubuntu-24 runner image, which is what broke this workflow outright.)
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: '1.18'
        otp-version: '27'
    - name: Restore dependencies cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Run tests
      run: mix test
